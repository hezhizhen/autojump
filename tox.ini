[tox]
envlist =
    py315
# ignore missing setup.py
skipsdist = True

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE = 1
deps =
    coverage
    pytest
commands =
    coverage run --source=bin/ -m \
        pytest -vv -rxs --tb native -s {posargs:tests}
    coverage report -m


[testenv:pre-commit]
deps =
    pre-commit>=0.7.0
commands =
    pre-commit {posargs}

[pytest]
norecursedirs = .git .tox docs
