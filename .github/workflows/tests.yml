name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install test runner
        run: python -m pip install tox
      - name: Run tests
        run: python -m tox -e py315
      - name: Run code checks
        run: python -m tox -e pre-commit -- run --all-files
